<header>
<h1> ¿Qué relación existe entre la exposición al contenido político difundido en TikTok y la formación de opiniones sobre los candidatos presidenciales en los estudiantes de los grados noveno, décimo y once de la IEF durante las elecciones presidenciales de Colombia de 2026? </h1>
</header>
<section>
<h2> Hipótesis: </h2>
<p> Existe una relación entre la exposición al contenido político difundido en TikTok y la formación de opiniones sobre los candidatos presidenciales en los estudiantes de los grados noveno, décimo y once de la IEF durante el periodo de las elecciones presidenciales de Colombia de 2026. </p>
<p> Los estudiantes estuvieron expuestos a diferentes tipos de contenido político relacionado con candidatos, propuestas y campañas durante el periodo electoral. Esta exposición puede presentar diferentes niveles de acuerdo con la frecuencia y el tipo de contenido consumido. </p>
<p> Asimismo, se plantea que pueden existir diferencias en la formación de opiniones sobre los candidatos según el nivel de exposición al contenido político difundido en TikTok. Esta relación será analizada a partir de los datos obtenidos de los estudiantes mediante encuestas. </p>
<p> En consecuencia, la investigación busca comprobar si existe una relación estadísticamente identificable entre la exposición al contenido político difundido en TikTok y la formación de opiniones sobre los candidatos presidenciales en los estudiantes de los grados noveno, décimo y once de la IEF. </p>
</section>
<section>
<h2> Justificación: </h2>
<p> Durante los procesos electorales, las redes sociales se convierten en espacios donde circula contenido relacionado con propuestas y campañas políticas. Castells (2009) explica que los medios digitales han transformado las formas de comunicación y circulación de información, permitiendo que los ciudadanos estén expuestos a diferentes mensajes políticos. </p>
<p> La importancia de esta investigación radica en analizar la exposición de los estudiantes de la IEF al contenido político difundido en TikTok y su relación con la formación de opiniones sobre los candidatos presidenciales. Boulianne (2020) señala que los medios digitales tienen un papel importante en la participación política </p>
<p> Además, Medina Serrano (2020) muestran que TikTok se ha convertido en un espacio de interacción política donde los usuarios pueden compartir y producir contenido relacionado con la política. De igual manera, Cervi y García Blesa (2023) explican que esta plataforma ha sido utilizada por políticos para acercarse a los usuarios mediante contenidos llamativos. </p>
<p> Finalmente, esta investigación puede aportar información sobre la relación existente entre el consumo de contenido político en TikTok y la formación de opiniones de los estudiantes. Los resultados permitirán identificar la exposición y opinión que pueden contribuir a promover un consumo más crítico y responsable de información política. </p>
</section>
